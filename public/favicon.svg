<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Shield Badge with Neo Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#121212" stroke="#121212" stroke-width="2"/>
  <rect x="2" y="2" width="56" height="56" rx="14" fill="#FF5A36" stroke="#121212" stroke-width="2.5"/>
  
  <!-- Laurel / Academic Leaves (Left & Right) -->
  <path d="M16 38 C 13 30, 16 22, 22 17 C 21 23, 23 29, 26 34" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M48 38 C 51 30, 48 22, 42 17 C 43 23, 41 29, 38 34" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Interlinked Marital Rings (Center) -->
  <circle cx="27" cy="32" r="9" stroke="#FFFDF7" stroke-width="2.5" fill="none"/>
  <circle cx="37" cy="32" r="9" stroke="#FFE600" stroke-width="2.5" fill="none"/>
  
  <!-- Doctoral Quill / Diamond Peak -->
  <polygon points="32,15 35,21 32,20 29,21" fill="#FFE600"/>
  
  <!-- Academic Ribbon / Base -->
  <rect x="22" y="45" width="20" height="5" rx="2.5" fill="#121212"/>
  <text x="32" y="49" font-family="monospace, serif" font-size="4" font-weight="900" fill="#FFE600" text-anchor="middle">IRB-2026</text>
</svg>
